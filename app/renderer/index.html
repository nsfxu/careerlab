<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>CareerLab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Icon set (24px stroke icons, drawn for CareerLab). Use: <svg class="i"><use href="#i-name"/></svg> -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
      <symbol id="i-sync" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.4 6.4L3 16"/><path d="M3 12a9 9 0 0 1 15.4-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M3 21v-5h5"/></symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 6h3v1a3 3 0 0 1-3 3"/><path d="M7 6H4v1a3 3 0 0 0 3 3"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h9"/><path d="M19 6h1"/><circle cx="16" cy="6" r="2.5"/><path d="M4 12h2"/><path d="M12 12h8"/><circle cx="9" cy="12" r="2.5"/><path d="M4 18h11"/><circle cx="18" cy="18" r="2.5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
      <symbol id="i-whistle" viewBox="0 0 24 24"><circle cx="9" cy="14" r="5"/><path d="M13 11l8-4v4l-6.2 3"/><path d="M6 6l1.5 2"/><path d="M10 4v2.5"/></symbol>
      <symbol id="i-shirt" viewBox="0 0 24 24"><path d="M8 3L3 6l2 5 3-1v11h8V10l3 1 2-5-5-3a4 4 0 0 1-8 0z"/></symbol>
      <symbol id="i-move" viewBox="0 0 24 24"><path d="M16 3l4 4-4 4"/><path d="M20 7H4"/><path d="M8 21l-4-4 4-4"/><path d="M4 17h16"/></symbol>
      <symbol id="i-user-minus" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a7 7 0 0 1 14 0v1"/><path d="M17 11h5"/></symbol>
      <symbol id="i-user-plus" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a7 7 0 0 1 14 0v1"/><path d="M19 8v6"/><path d="M16 11h6"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8"/><path d="M7 21v-7h10v7"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
      <symbol id="i-gamepad" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="5"/><path d="M6 12h4"/><path d="M8 10v4"/><path d="M15 11h.01"/><path d="M18 13h.01"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18"/><path d="M12 3a14 14 0 0 0 0 18"/></symbol>
      <symbol id="i-tactics" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18"/><circle cx="12" cy="12" r="3"/><path d="M6 8l2 2m0-2l-2 2"/><circle cx="17" cy="16" r="1.5"/></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a5 5 0 0 1-.6-10A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/><path d="M12 12v6"/><path d="M9 15l3 3 3-3"/></symbol>
    </defs>
  </svg>

  <header class="topbar">
    <div class="brand"><img src="../res/icon.png" alt="" class="brand-logo">Career<b>Lab</b></div>
    <div class="save-box">
      <svg class="i"><use href="#i-save"/></svg>
      <select id="save-picker" data-i18n-title="top.saveTitle"></select>
    </div>
    <div id="career-info" class="career-info"></div>
    <div class="spacer"></div>
    <span id="game-state" class="pill"></span>
    <nav class="top-actions">
      <button id="btn-league" class="ghost" disabled data-i18n-title="top.leagueTitle"><svg class="i"><use href="#i-trophy"/></svg><span data-i18n="top.league"></span></button>
      <button id="btn-backups" class="ghost" data-i18n-title="top.backupsTitle"><svg class="i"><use href="#i-history"/></svg><span data-i18n="top.backups"></span></button>
      <button id="btn-setup" class="ghost icon-only" data-i18n-title="top.settingsTitle"><svg class="i"><use href="#i-sliders"/></svg></button>
    </nav>
    <button id="btn-update" class="ghost update-btn" hidden><svg class="i"><use href="#i-cloud"/></svg><span id="update-text"></span></button>
    <button id="btn-review" class="primary" disabled><svg class="i"><use href="#i-check"/></svg><span data-i18n="top.review"></span> <span id="staged-count" class="count">0</span></button>
  </header>

  <main class="layout">
    <aside class="clubs panel">
      <div class="panel-head">
        <h2><svg class="i"><use href="#i-shield"/></svg><span data-i18n="clubs.title"></span> <span id="club-count" class="muted head-count"></span></h2>
        <div class="search-box">
          <svg class="i"><use href="#i-search"/></svg>
          <input id="club-filter" type="search" data-i18n-placeholder="clubs.filter">
        </div>
      </div>
      <ul id="club-list" class="club-list"></ul>
    </aside>

    <section class="squad panel">
      <div class="panel-head squad-head">
        <div class="squad-title">
          <h2 id="squad-name" data-i18n="squad.open"></h2>
          <div id="squad-manager" class="muted squad-meta"></div>
        </div>
        <div class="squad-tools">
          <div class="search-box grow">
            <svg class="i"><use href="#i-search"/></svg>
            <input id="player-search" type="search" data-i18n-placeholder="squad.search">
          </div>
          <button id="btn-sync" class="ghost" disabled data-i18n-title="squad.syncTitle"><svg class="i"><use href="#i-sync"/></svg><span data-i18n="squad.sync"></span></button>
          <button id="btn-tactics" class="ghost" disabled data-i18n-title="squad.tacticsTitle"><svg class="i"><use href="#i-tactics"/></svg><span data-i18n="squad.tactics"></span></button>
          <button id="btn-manager" class="ghost" disabled data-i18n-title="squad.managerTitle"><svg class="i"><use href="#i-whistle"/></svg><span data-i18n="squad.manager"></span></button>
        </div>
      </div>
      <div id="search-results" class="search-results hidden"></div>
      <div class="table-wrap">
        <table class="squad-table">
          <thead><tr><th class="c-num">#</th><th class="c-pos">Pos</th><th data-i18n="col.name"></th><th class="c-num" data-i18n="col.age"></th><th class="c-num" data-i18n="col.speed" data-i18n-title="col.speedTitle"></th></tr></thead>
          <tbody id="squad-body"></tbody>
        </table>
      </div>
    </section>

    <section class="detail panel">
      <div id="detail" class="detail-empty"><svg class="i big"><use href="#i-user"/></svg><span data-i18n="detail.empty"></span></div>
    </section>
  </main>

  <dialog id="dlg-review" class="dialog">
    <h2 tabindex="-1" autofocus><svg class="i"><use href="#i-check"/></svg><span data-i18n="review.title"></span></h2>
    <p class="muted" data-i18n="review.note"></p>
    <ol id="staged-list" class="staged-list"></ol>
    <div id="review-check" class="review-check"></div>
    <div class="dialog-actions">
      <button id="btn-undo-all" class="ghost danger left" data-i18n-title="review.undoAllTitle"><svg class="i"><use href="#i-x"/></svg><span data-i18n="review.undoAll"></span></button>
      <button id="btn-close-review" class="ghost" data-i18n="close"></button>
      <button id="btn-apply" class="primary"><svg class="i"><use href="#i-save"/></svg><span data-i18n="review.apply"></span></button>
    </div>
  </dialog>

  <dialog id="dlg-pick" class="dialog">
    <h2 tabindex="-1" autofocus id="pick-title"></h2>
    <div class="search-box">
      <svg class="i"><use href="#i-search"/></svg>
      <input id="pick-filter" type="search" data-i18n-placeholder="pick.filter">
    </div>
    <ul id="pick-list" class="pick-list"></ul>
    <label id="pick-option" class="pick-option hidden"><input type="checkbox" id="pick-check"> <span></span></label>
    <div class="dialog-actions"><button id="btn-close-pick" class="ghost" data-i18n="cancel"></button></div>
  </dialog>

  <dialog id="dlg-sync" class="dialog wide">
    <h2 tabindex="-1" autofocus><svg class="i"><use href="#i-sync"/></svg><span id="sync-title"></span></h2>
    <p class="muted" data-i18n="sync.note"></p>
    <div id="sync-body" class="sync-body"></div>
    <div class="dialog-actions">
      <button id="btn-sync-refresh" class="ghost left"><svg class="i"><use href="#i-cloud"/></svg><span data-i18n="sync.refresh"></span></button>
      <button id="btn-close-sync" class="ghost" data-i18n="cancel"></button>
      <button id="btn-sync-stage" class="primary" data-i18n="stage"></button>
    </div>
  </dialog>

  <dialog id="dlg-league" class="dialog wide">
    <h2 tabindex="-1" autofocus><svg class="i"><use href="#i-trophy"/></svg><span data-i18n="league.title"></span></h2>
    <p class="muted" data-i18n="league.note"></p>
    <div class="league-head">
      <select id="league-picker"></select>
      <div id="league-kinds" class="league-kinds"></div>
    </div>
    <div id="league-body" class="sync-body"></div>
    <div class="dialog-actions">
      <span id="league-total" class="muted league-total"></span>
      <button id="btn-league-refresh" class="ghost"><svg class="i"><use href="#i-cloud"/></svg><span data-i18n="league.refresh"></span></button>
      <button id="btn-close-league" class="ghost" data-i18n="cancel"></button>
      <button id="btn-league-stage" class="primary" data-i18n="stage"></button>
    </div>
  </dialog>

  <dialog id="dlg-backups" class="dialog">
    <h2 tabindex="-1" autofocus><svg class="i"><use href="#i-history"/></svg><span data-i18n="bk.title"></span></h2>
    <p class="muted" data-i18n="bk.note"></p>
    <ul id="backup-list" class="pick-list"></ul>
    <div class="dialog-actions"><button id="btn-close-backups" class="ghost" data-i18n="close"></button></div>
  </dialog>

  <dialog id="dlg-setup" class="dialog">
    <h2 tabindex="-1" autofocus><svg class="i"><use href="#i-sliders"/></svg><span data-i18n="setup.title"></span></h2>
    <p class="muted" data-i18n="setup.note"></p>
    <div class="setup-step lang-step">
      <svg class="i step-icon"><use href="#i-globe"/></svg>
      <div><b data-i18n="setup.language"></b></div>
      <div class="flags">
        <button class="flag" data-lang="pt" title="Português (Brasil)" aria-label="Português (Brasil)">
          <svg viewBox="0 0 28 20"><rect width="28" height="20" fill="#009c3b"/><path d="M14 2.2 25.6 10 14 17.8 2.4 10z" fill="#ffdf00"/><circle cx="14" cy="10" r="4.6" fill="#002776"/><path d="M9.6 9.1c2.9-.5 6.1.2 8.7 1.9" stroke="#fff" stroke-width=".9" fill="none"/></svg>
          <span>PT-BR</span>
        </button>
        <button class="flag" data-lang="en" title="English (US)" aria-label="English (US)">
          <svg viewBox="0 0 28 20"><rect width="28" height="20" fill="#fff"/><g fill="#b22234"><rect width="28" height="1.54"/><rect y="3.08" width="28" height="1.54"/><rect y="6.15" width="28" height="1.54"/><rect y="9.23" width="28" height="1.54"/><rect y="12.31" width="28" height="1.54"/><rect y="15.38" width="28" height="1.54"/><rect y="18.46" width="28" height="1.54"/></g><rect width="12" height="10.77" fill="#3c3b6e"/><g fill="#fff"><circle cx="2.4" cy="2.2" r=".55"/><circle cx="6" cy="2.2" r=".55"/><circle cx="9.6" cy="2.2" r=".55"/><circle cx="4.2" cy="4.4" r=".55"/><circle cx="7.8" cy="4.4" r=".55"/><circle cx="2.4" cy="6.6" r=".55"/><circle cx="6" cy="6.6" r=".55"/><circle cx="9.6" cy="6.6" r=".55"/><circle cx="4.2" cy="8.8" r=".55"/><circle cx="7.8" cy="8.8" r=".55"/></g></svg>
          <span>EN-US</span>
        </button>
      </div>
    </div>
    <div class="setup-step" id="step-game">
      <svg class="i step-icon"><use href="#i-gamepad"/></svg>
      <div><b data-i18n="setup.game"></b><div class="muted path" id="setup-game"></div></div>
      <button id="btn-setup-game" class="ghost"><svg class="i"><use href="#i-folder"/></svg><span data-i18n="setup.choose"></span></button>
    </div>
    <div class="setup-step" id="step-db">
      <svg class="i step-icon"><use href="#i-database"/></svg>
      <div><b data-i18n="setup.db"></b><div class="muted" id="setup-db"></div></div>
      <button id="btn-setup-module" class="ghost" data-i18n="setup.installReader"></button>
    </div>
    <div class="setup-step" id="step-saves">
      <svg class="i step-icon"><use href="#i-save"/></svg>
      <div><b data-i18n="setup.saves"></b><div class="muted path" id="setup-saves"></div></div>
      <button id="btn-setup-saves" class="ghost"><svg class="i"><use href="#i-folder"/></svg><span data-i18n="setup.choose"></span></button>
    </div>
    <div class="dialog-actions">
      <span class="muted left setup-version"><span id="setup-version"></span> · <span id="update-status"></span>
        <button id="btn-update-check" class="ghost small" data-i18n="update.check"></button></span>
      <button id="btn-setup-check" class="ghost" data-i18n="setup.check"></button>
      <button id="btn-setup-done" class="primary" data-i18n="setup.continue"></button>
    </div>
  </dialog>

  <div id="toast" class="toast hidden"></div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
